name: Compose Final Maderoom Video

on:
  push:
    paths:
      - 'compose-requests/*.json'
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Maderoom project id'
        required: true
        type: string

permissions:
  contents: read

env:
  SCENES_API: https://qlwcxovrdglmmvprddvj.supabase.co/functions/v1/maderoom-project-scenes
  UPLOAD_API: https://qlwcxovrdglmmvprddvj.supabase.co/functions/v1/maderoom-upload-final-video

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl
          ffmpeg -version

      - name: Resolve project id
        id: project
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROJECT_ID="${{ inputs.project_id }}"
          else
            FILE=$(ls -t compose-requests/*.json | head -n 1)
            PROJECT_ID=$(jq -r '.project_id' "$FILE")
          fi
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "No project_id found" >&2
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_ID"

      - name: Fetch project assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$SCENES_API?project_id=$PROJECT_ID&v=$(date +%s)" -o project.json
          echo "Project payload downloaded"
          jq '{project: .project.id, status: .project.status, scenes: (.scenes|length), music: (.project.music_track_url != null)}' project.json
          jq -r '.scenes | sort_by(.scene_number) | .[].animation_video_url' project.json > video_urls.txt
          jq -r '.scenes | sort_by(.scene_number) | .[].voice_audio_url' project.json > audio_urls.txt
          jq -r '.project.music_track_url' project.json > music_url.txt
          test "$(wc -l < video_urls.txt | tr -d ' ')" = "6"
          test "$(wc -l < audio_urls.txt | tr -d ' ')" = "6"
          test "$(cat music_url.txt)" != "null"

      - name: Download assets
        shell: bash
        run: |
          set -euo pipefail
          i=1
          while read -r url; do
            echo "Downloading video $i"
            curl -L --retry 4 --retry-delay 3 -o "v${i}.mp4" "$url"
            test -s "v${i}.mp4"
            i=$((i+1))
          done < video_urls.txt
          i=1
          while read -r url; do
            echo "Downloading voice $i"
            curl -L --retry 4 --retry-delay 3 -o "a${i}.mp3" "$url"
            test -s "a${i}.mp3"
            i=$((i+1))
          done < audio_urls.txt
          MUSIC_URL=$(cat music_url.txt)
          curl -L --retry 4 --retry-delay 3 -o music.mp3 "$MUSIC_URL"
          test -s music.mp3

      - name: Build scene clips
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            echo "Building scene $i"
            ffmpeg -y \
              -i "v${i}.mp4" \
              -i "a${i}.mp3" \
              -t 5 \
              -map 0:v:0 -map 1:a:0 \
              -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30" \
              -af "apad,atrim=0:5" \
              -c:v libx264 -preset veryfast -crf 24 \
              -c:a aac -b:a 128k \
              "seg${i}.mp4"
          done

      - name: Concatenate and mix music
        shell: bash
        run: |
          set -euo pipefail
          printf "file 'seg1.mp4'\nfile 'seg2.mp4'\nfile 'seg3.mp4'\nfile 'seg4.mp4'\nfile 'seg5.mp4'\nfile 'seg6.mp4'\n" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy joined.mp4
          ffmpeg -y \
            -i joined.mp4 \
            -stream_loop -1 -i music.mp3 \
            -filter_complex "[0:a]volume=1.0[a0];[1:a]volume=0.18[a1];[a0][a1]amix=inputs=2:duration=first:dropout_transition=2[a]" \
            -map 0:v:0 -map "[a]" \
            -c:v copy -c:a aac -b:a 160k \
            -shortest -movflags +faststart \
            maderoom_final.mp4
          ls -lh maderoom_final.mp4

      - name: Upload final video to Supabase
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST "$UPLOAD_API?project_id=$PROJECT_ID" \
            -H "Content-Type: video/mp4" \
            --data-binary @maderoom_final.mp4 \
            -o upload-result.json
          cat upload-result.json
          jq -e '.ok == true' upload-result.json

      - name: Keep artifact copy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maderoom-final-video
          path: |
            maderoom_final.mp4
            upload-result.json
            project.json
          if-no-files-found: ignore
